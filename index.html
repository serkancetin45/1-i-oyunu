<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Hece Okuma Oyunu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka+One&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'BenimFontum';
            src: url('font-dosyaniz.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --neon-blue: #3b82f6;
            --neon-cyan: #06b6d4;
            --neon-pink: #d946ef;
            --neon-green: #22c55e;
            --neon-purple: #a855f7;
            --neon-orange: #f97316;
            --yellow-btn: #fde047;
            --bg-base: #060b19;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(217, 70, 239, 0.1) 0%, transparent 50%);
            font-family: 'BenimFontum', 'Patrick Hand', cursive, sans-serif;
            font-weight: bold;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 500px;
            height: 100dvh;
            max-height: 900px;
            position: relative;
            padding: 12px 15px 6px 15px;
            flex-direction: column;
            overflow: hidden;
        }

        .screen.active {
            display: flex;
        }

        /* --- KONFETİ KATMANI --- */
        .confetti-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 14px;
            opacity: 0;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg) scale(0.6);
                opacity: 0.2;
            }
        }

        /* --- ÜST BAR --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            height: 85px;
            flex-shrink: 0;
            position: relative;
        }

        .vinyl-container {
            width: 80px;
            height: 80px;
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vinyl {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: 
                radial-gradient(circle, #111 15%, transparent 16%),
                radial-gradient(circle, transparent 25%, rgba(255,255,255,0.05) 26%, transparent 27%),
                radial-gradient(circle, transparent 35%, rgba(255,255,255,0.05) 36%, transparent 37%),
                radial-gradient(circle, transparent 45%, rgba(255,255,255,0.05) 46%, transparent 47%),
                conic-gradient(from 0deg, #0f172a, #1e293b, #0f172a, #1e293b, #0f172a);
            box-shadow: 
                0 0 15px rgba(59, 130, 246, 0.4),
                inset 0 0 15px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 3s linear infinite;
            animation-play-state: paused;
            position: relative;
        }

        .vinyl-center {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border-radius: 50%;
            border: 2px solid #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vinyl-center::after {
            content: '';
            width: 5px;
            height: 5px;
            background: #000;
            border-radius: 50%;
        }

        .notes-container {
            position: absolute;
            left: 90px;
            top: 5px;
            right: 50px;
            height: 75px;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .floating-note {
            position: absolute;
            opacity: 0;
            animation: danceNote 2s infinite ease-in-out;
            animation-play-state: paused;
            bottom: 0;
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
        }

        .note1  { left: 0%;   font-size: 1.4rem; color: var(--neon-cyan);   animation-delay: 0.0s; }
        .note2  { left: 8%;   font-size: 0.9rem; color: var(--neon-blue);   animation-delay: 0.3s; }
        .note3  { left: 16%;  font-size: 1.6rem; color: var(--neon-pink);   animation-delay: 0.6s; }
        .note4  { left: 24%;  font-size: 1.1rem; color: var(--neon-purple); animation-delay: 0.9s; }
        .note5  { left: 32%;  font-size: 1.3rem; color: var(--neon-orange); animation-delay: 1.2s; }
        .note6  { left: 40%;  font-size: 1.0rem; color: var(--neon-cyan);   animation-delay: 0.15s; }
        .note7  { left: 48%;  font-size: 1.8rem; color: var(--neon-pink);   animation-delay: 0.45s; }
        .note8  { left: 56%;  font-size: 1.2rem; color: var(--neon-blue);   animation-delay: 0.75s; }
        .note9  { left: 64%;  font-size: 1.4rem; color: var(--neon-green);  animation-delay: 1.05s; }
        .note10 { left: 72%;  font-size: 0.9rem; color: var(--neon-purple); animation-delay: 1.35s; }
        .note11 { left: 80%;  font-size: 1.5rem; color: var(--neon-cyan);   animation-delay: 0.2s; }
        .note12 { left: 88%;  font-size: 1.1rem; color: var(--neon-orange); animation-delay: 0.5s; }

        .settings-icon {
            width: 36px;
            height: 36px;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }
        .settings-icon:hover { transform: rotate(90deg) scale(1.1); }

        .round-indicator {
            text-align: center;
            font-family: 'Fredoka One', cursive;
            font-size: 1rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
            padding: 4px 0;
            letter-spacing: 1px;
            display: none;
            flex-shrink: 0;
            transition: transform 0.4s, color 0.4s;
        }

        .score-area {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
            display: none;
        }

        .player-score {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.95rem;
            padding: 5px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border: 2px solid transparent;
            transition: all 0.4s ease;
            color: #64748b;
            text-align: center;
        }
        
        .player-score .p-name {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 1px;
        }

        .player-score .p-score {
            font-family: 'Fredoka One', cursive;
            font-weight: bold;
            color: var(--yellow-btn);
            font-size: 0.95rem;
        }

        .player-score.active-turn {
            color: white;
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4), inset 0 0 10px rgba(59, 130, 246, 0.2);
            transform: scale(1.03);
        }

        /* --- KELİME EKRANI (DAHA KALIN NEON) --- */
        .neon-box {
            border: 5px solid rgba(59, 130, 246, 0.9);
            border-radius: 20px;
            flex: 1;
            min-height: 0;
            position: relative;
            box-shadow: 
                0 0 10px rgba(59, 130, 246, 0.9),
                0 0 25px rgba(59, 130, 246, 0.7), 
                0 0 50px rgba(59, 130, 246, 0.5),
                0 0 80px rgba(59, 130, 246, 0.3),
                inset 0 0 15px rgba(59, 130, 246, 0.4),
                inset 0 0 30px rgba(59, 130, 246, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(5px);
            overflow: hidden;
        }

        .start-btn {
            background: linear-gradient(to bottom, #fef08a, #eab308);
            border: 2px solid #fff;
            border-radius: 30px;
            color: #1e3a8a;
            font-family: 'Fredoka One', cursive;
            font-weight: bold;
            font-size: 1.6rem;
            padding: 10px 35px;
            box-shadow: 
                0 4px 0 #ca8a04, 
                0 8px 15px rgba(0,0,0,0.6),
                0 0 30px rgba(253, 224, 71, 0.5), 
                inset 0 0 15px rgba(255,255,255,0.6);
            cursor: pointer;
            transition: 0.1s;
            z-index: 5;
        }
        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ca8a04, 0 4px 8px rgba(0,0,0,0.6), 0 0 20px rgba(253, 224, 71, 0.4);
        }

        .word-display {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            text-align: center;
            white-space: nowrap;
            font-size: clamp(2rem, 22vw, 7rem);
            color: var(--yellow-btn);
            text-shadow: 0 0 20px rgba(253, 224, 71, 0.6), 0 0 50px rgba(253, 224, 71, 0.3);
            z-index: 10;
            padding: 0 5px;
            letter-spacing: 2px;
            transition: filter 0.1s, opacity 0.1s;
            overflow: hidden;
        }

        /* --- CEVAP BUTONLARI --- */
        .answer-buttons {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            padding: 5px 0 10px 0;
            flex-shrink: 0;
            gap: 12px;
        }

        .round-btn {
            flex: 1;
            max-width: 180px;
            min-height: 75px;
            border-radius: 20px;
            border: 3px solid rgba(255,255,255,0.9);
            font-size: 1.1rem;
            font-family: 'Fredoka One', cursive;
            font-weight: bold;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.1s;
            position: relative;
            padding: 8px 10px;
            text-align: center;
            line-height: 1.2;
            letter-spacing: 0.5px;
        }
        
        .round-btn:active {
            transform: translateY(3px) scale(0.97);
        }

        .round-btn .btn-main {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }

        .round-btn .btn-sub {
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: normal;
        }

        .btn-true { 
            background: radial-gradient(circle at 30% 30%, #4ade80, #166534);
            box-shadow: 
                0 6px 0 #14532d, 
                0 10px 20px rgba(0,0,0,0.6),
                0 0 30px rgba(74, 222, 128, 0.6), 
                inset 0 -4px 10px rgba(0,0,0,0.3),
                inset 0 4px 15px rgba(255,255,255,0.3);
        }
        
        .btn-false { 
            background: radial-gradient(circle at 30% 30%, #f87171, #991b1b);
            box-shadow: 
                0 6px 0 #7f1d1d, 
                0 10px 20px rgba(0,0,0,0.6),
                0 0 30px rgba(248, 113, 113, 0.6), 
                inset 0 -4px 10px rgba(0,0,0,0.3),
                inset 0 4px 15px rgba(255,255,255,0.3);
        }
        
        .round-btn:disabled {
            opacity: 0.3;
            transform: none;
            box-shadow: none;
            filter: grayscale(0.8);
        }

        /* --- ALT YAZI (Normal font, yeşil neon) --- */
        .footer-note {
            width: 100%;
            text-align: center;
            font-family: 'Patrick Hand', 'Segoe UI', sans-serif;
            font-weight: normal;
            font-size: 0.75rem;
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green), 0 0 10px var(--neon-green);
            opacity: 0.9;
            pointer-events: none;
            letter-spacing: 0.3px;
            padding: 4px 0 6px 0;
            flex-shrink: 0;
            line-height: 1.4;
        }

        .neon-box-pink {
            border: 3px solid rgba(217, 70, 239, 0.8);
            border-radius: 20px;
            flex: 1;
            min-height: 0;
            position: relative;
            box-shadow: 
                0 0 20px rgba(217, 70, 239, 0.3), 
                inset 0 0 20px rgba(217, 70, 239, 0.2);
            display: flex;
            flex-direction: column;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            overflow-y: auto;
        }

        .palm-tree {
            position: absolute;
            top: -50px; left: -8px;
            font-size: 50px;
            color: #22c55e;
            text-shadow: 0 0 15px #22c55e;
            transform: rotate(-10deg);
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        .settings-label {
            font-family: 'BenimFontum', 'Patrick Hand', cursive;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: #cbd5e1;
        }

        .name-input-setting, .words-textarea {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: white;
            padding: 10px 12px;
            font-family: 'BenimFontum', 'Patrick Hand', cursive;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .name-input-setting:focus, .words-textarea:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.3);
        }

        .words-textarea {
            flex: 1;
            min-height: 100px;
            resize: none;
            line-height: 1.5;
        }

        .back-btn {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.7);
            color: white;
            padding: 10px;
            border-radius: 20px;
            font-family: 'BenimFontum', 'Patrick Hand', cursive;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            align-self: center;
            width: 100%;
            max-width: 250px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .back-btn:active { background: rgba(255,255,255,0.1); }

        /* --- OYUN SONU EKRANI --- */
        #endScreen {
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            gap: 15px;
        }

        .end-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan);
            animation: pulseText 2s ease-in-out infinite;
        }

        .end-winner {
            font-family: 'Fredoka One', cursive;
            font-size: 1.4rem;
            color: var(--yellow-btn);
            text-shadow: 0 0 15px var(--yellow-btn);
            padding: 15px 25px;
            border-radius: 15px;
            background: rgba(253, 224, 71, 0.1);
            border: 2px solid var(--yellow-btn);
            animation: pulseText 2s ease-in-out infinite;
            max-width: 100%;
        }

        .end-scores {
            list-style: none;
            width: 100%;
            max-width: 350px;
            padding: 0;
            margin: 0;
        }

        .end-scores li {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            font-size: 1.2rem;
            border: 2px solid transparent;
        }

        .end-scores li:first-child {
            border-color: var(--yellow-btn);
            background: rgba(253, 224, 71, 0.15);
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.3);
        }

        .end-scores li span:last-child {
            font-family: 'Fredoka One', cursive;
            color: var(--yellow-btn);
        }

        .end-btn {
            background: linear-gradient(to bottom, #fef08a, #eab308);
            border: 2px solid #fff;
            border-radius: 30px;
            color: #1e3a8a;
            font-family: 'Fredoka One', cursive;
            font-weight: bold;
            font-size: 1.3rem;
            padding: 12px 35px;
            box-shadow: 
                0 4px 0 #ca8a04, 
                0 8px 15px rgba(0,0,0,0.6),
                0 0 30px rgba(253, 224, 71, 0.5), 
                inset 0 0 15px rgba(255,255,255,0.6);
            cursor: pointer;
            transition: 0.1s;
        }

        .end-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ca8a04, 0 4px 8px rgba(0,0,0,0.6);
        }

        @keyframes pulseText {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes danceNote {
            0%   { transform: translateY(0) rotate(-10deg) scale(1); opacity: 0; }
            20%  { opacity: 1; }
            50%  { transform: translateY(-30px) rotate(15deg) scale(1.2); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateY(-60px) rotate(-10deg) scale(0.9); opacity: 0; }
        }

        .music-playing .floating-note { animation-play-state: running; }

        @media (min-width: 768px) {
            .screen { height: 90vh; max-height: 850px; border: 1px solid rgba(255,255,255,0.05); border-radius: 25px; box-shadow: 0 0 60px rgba(0,0,0,0.9), 0 0 100px rgba(59,130,246,0.1); }
            .round-btn { min-height: 90px; }
            .round-btn .btn-main { font-size: 1.5rem; }
            .round-btn .btn-sub { font-size: 1rem; }
            .footer-note { font-size: 0.85rem; padding: 8px 0; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src=""></audio>

    <!-- KONFETİ KATMANI -->
    <div class="confetti-layer" id="confettiLayer"></div>

    <!-- ANA EKRAN -->
    <div id="homeScreen" class="screen active">
        <div class="top-bar" id="topBar">
            <div class="vinyl-container">
                <div class="vinyl" id="recordDisc">
                    <div class="vinyl-center"></div>
                </div>
            </div>
            
            <div class="notes-container">
                <div class="floating-note note1">♪</div>
                <div class="floating-note note2">♫</div>
                <div class="floating-note note3">♩</div>
                <div class="floating-note note4">♬</div>
                <div class="floating-note note5">♪</div>
                <div class="floating-note note6">♫</div>
                <div class="floating-note note7">♩</div>
                <div class="floating-note note8">♬</div>
                <div class="floating-note note9">♪</div>
                <div class="floating-note note10">♫</div>
                <div class="floating-note note11">♩</div>
                <div class="floating-note note12">♬</div>
            </div>

            <div class="settings-icon" onclick="openSettings()">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </div>
        </div>

        <div class="round-indicator" id="roundIndicator">Tur: 1 / 2</div>
        <div class="score-area" id="scoreArea"></div>

        <div class="neon-box">
            <button class="start-btn" id="startBtn" onclick="startGame()">START</button>
            <div class="word-display" id="wordDisplay"></div>
        </div>

        <div class="answer-buttons">
            <button class="round-btn btn-true" id="btnCorrect" onclick="checkAnswer(true)" disabled>
                <span class="btn-main">DOĞRU</span>
                <span class="btn-sub">(+10 Puan)</span>
            </button>
            <button class="round-btn btn-false" id="btnWrong" onclick="checkAnswer(false)" disabled>
                <span class="btn-main">PAS</span>
                <span class="btn-sub">(0 Puan)</span>
            </button>
        </div>
        
        <div class="footer-note">1/İ sınıfı için hazırlandı. Hüseyin Akdağ İlkokulu</div>
    </div>

    <!-- AYARLAR EKRANI -->
    <div id="settingsScreen" class="screen">
        <div class="top-bar" style="justify-content: flex-end; height: auto; margin-bottom: 8px;">
             <div class="settings-icon" onclick="closeSettings()">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
        </div>

        <div class="neon-box-pink">
            <div class="palm-tree">🌴</div>
            
            <div class="settings-label">1. Oyuncu Adı</div>
            <input type="text" id="p1Name" class="name-input-setting" value="Oyuncu 1" maxlength="15">
            
            <div class="settings-label">2. Oyuncu Adı</div>
            <input type="text" id="p2Name" class="name-input-setting" value="Oyuncu 2" maxlength="15">

            <div class="settings-label">Kelimeler (Her satıra bir kelime)</div>
            <textarea id="wordsInput" class="words-textarea" placeholder="Örn:&#10;kitap&#10;kalem&#10;deniz"></textarea>
            
            <button class="back-btn" onclick="saveSettings()">KAYDET & GERİ DÖN</button>
        </div>
        
        <div class="footer-note">1/İ sınıfı için hazırlandı. Hüseyin Akdağ İlkokulu</div>
    </div>

    <!-- OYUN SONU EKRANI -->
    <div id="endScreen" class="screen">
        <h1 class="end-title">🏆 Oyun Bitti! 🏆</h1>
        <div class="end-winner" id="winnerText">Kazanan: —</div>
        <ul class="end-scores" id="endScores"></ul>
        <button class="end-btn" onclick="restartGame()">🔄 Yeniden Oyna</button>
        <div class="footer-note">1/İ sınıfı için hazırlandı. Hüseyin Akdağ İlkokulu</div>
    </div>

    <script>
        let players = [
            { id: 1, name: 'Oyuncu 1', score: 0 },
            { id: 2, name: 'Oyuncu 2', score: 0 }
        ];
        let currentPlayerIndex = 0;
        let words = ["an", "na", "ana", "en", "ne", "nane", "anne", "nene", "at", "ta", "Ata", "ten", "anten", "Tan", "tat", "et", "net"];
        let isGameActive = false;
        let canAnswer = false;

        let wordBag = [];
        let currentRound = 1;
        const TOTAL_ROUNDS = 2;

        let rollInterval = null;

        const songs = [
            "sarki1.mp3", 
            "sarki2.mp3"
        ];
        
        const audioPlayer = document.getElementById('bgMusic');

        const homeScreen = document.getElementById('homeScreen');
        const settingsScreen = document.getElementById('settingsScreen');
        const endScreen = document.getElementById('endScreen');
        const startBtn = document.getElementById('startBtn');
        const wordDisplay = document.getElementById('wordDisplay');
        const btnCorrect = document.getElementById('btnCorrect');
        const btnWrong = document.getElementById('btnWrong');
        const recordDisc = document.getElementById('recordDisc');
        const scoreArea = document.getElementById('scoreArea');
        const roundIndicator = document.getElementById('roundIndicator');
        const p1Input = document.getElementById('p1Name');
        const p2Input = document.getElementById('p2Name');
        const wordsInput = document.getElementById('wordsInput');
        const topBar = document.getElementById('topBar');
        const winnerText = document.getElementById('winnerText');
        const endScores = document.getElementById('endScores');
        const confettiLayer = document.getElementById('confettiLayer');

        // --- KONFETİ FONKSİYONU ---
        function launchConfetti() {
            const colors = ['#22c55e', '#3b82f6', '#d946ef', '#fde047', '#f97316', '#06b6d4', '#a855f7', '#ef4444'];
            const pieceCount = 80;

            for (let i = 0; i < pieceCount; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                
                // Rastgele özellikler
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const delay = Math.random() * 0.5;
                const duration = 2 + Math.random() * 1.5;
                const size = 6 + Math.random() * 8;
                const isCircle = Math.random() > 0.5;
                
                piece.style.left = left + 'vw';
                piece.style.width = size + 'px';
                piece.style.height = size + 'px';
                piece.style.background = color;
                piece.style.borderRadius = isCircle ? '50%' : '2px';
                piece.style.boxShadow = `0 0 8px ${color}`;
                piece.style.animationDuration = duration + 's';
                piece.style.animationDelay = delay + 's';
                
                confettiLayer.appendChild(piece);
                
                // Animasyon bittikten sonra temizle
                setTimeout(() => {
                    if (piece.parentNode) piece.remove();
                }, (duration + delay) * 1000 + 200);
            }
        }

        function openSettings() {
            settingsScreen.classList.add('active');
            homeScreen.classList.remove('active');
            p1Input.value = players[0].name;
            p2Input.value = players[1].name;
            wordsInput.value = words.join('\n');
        }

        function closeSettings() {
            settingsScreen.classList.remove('active');
            homeScreen.classList.add('active');
        }

        function saveSettings() {
            players[0].name = p1Input.value.trim() || 'Oyuncu 1';
            players[1].name = p2Input.value.trim() || 'Oyuncu 2';
            
            const text = wordsInput.value.trim();
            if (text) {
                words = text.split('\n').map(w => w.trim()).filter(w => w.length > 0);
            }
            
            if (!isGameActive) {
                updateScoreboard();
            }
            closeSettings();
        }

        function fillWordBag() {
            wordBag = [...words];
            for (let i = wordBag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [wordBag[i], wordBag[j]] = [wordBag[j], wordBag[i]];
            }
        }

        function drawWordFromBag() {
            if (wordBag.length === 0) {
                currentRound++;
                if (currentRound > TOTAL_ROUNDS) {
                    endGame();
                    return null;
                }
                fillWordBag();
                updateRoundIndicator();
            }
            return wordBag.shift();
        }

        function updateRoundIndicator() {
            roundIndicator.textContent = `Tur: ${currentRound} / ${TOTAL_ROUNDS}`;
            roundIndicator.style.transform = 'scale(1.3)';
            roundIndicator.style.color = '#fde047';
            setTimeout(() => {
                roundIndicator.style.transform = 'scale(1)';
                roundIndicator.style.color = '';
            }, 500);
        }

        function startGame() {
            players.forEach(p => p.score = 0);
            currentPlayerIndex = 0;
            isGameActive = true;
            currentRound = 1;

            fillWordBag();
            
            scoreArea.style.display = 'flex';
            roundIndicator.style.display = 'block';
            updateRoundIndicator();
            updateScoreboard();
            
            startBtn.style.display = 'none';
            wordDisplay.style.display = 'flex';
            
            playTurn();
        }

        function playTurn() {
            updateScoreboard();
            
            btnCorrect.disabled = true;
            btnWrong.disabled = true;
            canAnswer = false;

            playRandomMusic();
            startWordRoll();

            setTimeout(() => {
                stopMusic();
                stopWordRoll();
            }, 6000);
        }

        function playRandomMusic() {
            if (songs.length === 0) return;
            
            const randomSong = songs[Math.floor(Math.random() * songs.length)];
            audioPlayer.src = randomSong;
            audioPlayer.play().catch(e => console.log("Müzik çalınamadı:", e));
            
            recordDisc.style.animationPlayState = 'running';
            topBar.classList.add('music-playing');
        }

        function stopMusic() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            
            recordDisc.style.animationPlayState = 'paused';
            topBar.classList.remove('music-playing');
        }

        function startWordRoll() {
            rollInterval = setInterval(() => {
                const randomWord = words[Math.floor(Math.random() * words.length)];
                wordDisplay.textContent = randomWord;
                wordDisplay.style.opacity = "0.7"; 
            }, 60);
        }

        function stopWordRoll() {
            clearInterval(rollInterval);
            wordDisplay.style.opacity = "1";

            const finalWord = drawWordFromBag();
            
            if (finalWord === null) return;
            
            wordDisplay.textContent = finalWord;
            
            btnCorrect.disabled = false;
            btnWrong.disabled = false;
            canAnswer = true;
        }

        function checkAnswer(isCorrect) {
            if (!canAnswer) return;
            canAnswer = false;
            
            btnCorrect.disabled = true;
            btnWrong.disabled = true;

            if (isCorrect) {
                players[currentPlayerIndex].score += 10;
                // DOĞRU CEVAPTA KONFETİ PATLAT
                launchConfetti();
            }

            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            wordDisplay.style.display = 'none';

            setTimeout(() => {
                if (isGameActive) {
                    wordDisplay.style.display = 'flex';
                    playTurn();
                }
            }, 1000);
        }

        function endGame() {
            isGameActive = false;
            stopMusic();
            clearInterval(rollInterval);

            let winner = players[0];
            if (players[1].score > players[0].score) winner = players[1];
            
            if (players[0].score === players[1].score) {
                winnerText.textContent = `🤝 Berabere! (${players[0].score} puan)`;
            } else {
                winnerText.textContent = `👑 Kazanan: ${winner.name} (${winner.score} puan)`;
            }

            const sorted = [...players].sort((a, b) => b.score - a.score);
            endScores.innerHTML = '';
            sorted.forEach((p) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${p.name}</span> <span>${p.score} Puan</span>`;
                endScores.appendChild(li);
            });

            homeScreen.classList.remove('active');
            endScreen.classList.add('active');
        }

        function restartGame() {
            endScreen.classList.remove('active');
            homeScreen.classList.add('active');
            
            players.forEach(p => p.score = 0);
            currentPlayerIndex = 0;
            currentRound = 1;
            wordBag = [];
            isGameActive = false;
            canAnswer = false;
            
            wordDisplay.style.display = 'none';
            wordDisplay.textContent = '';
            startBtn.style.display = 'block';
            roundIndicator.style.display = 'none';
            scoreArea.style.display = 'none';
            scoreArea.innerHTML = '';
        }

        function updateScoreboard() {
            scoreArea.innerHTML = '';
            players.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = `player-score ${index === currentPlayerIndex && isGameActive ? 'active-turn' : ''}`;
                div.innerHTML = `
                    <div class="p-name">${p.name}</div>
                    <div class="p-score">${p.score} Puan</div>
                `;
                scoreArea.appendChild(div);
            });
        }
    </script>
</body>
</html>
